# raspinfo.com 커뮤니티 — nginx 리버스 프록시 예시
#
# 커뮤니티를 하위 경로가 아니라 서브도메인(community.raspinfo.com)으로 두는 구성입니다.
# 기존 사이트와 경로를 섞지 않아 쿠키 범위와 캐시 정책이 깔끔해집니다.

server {
    listen 80;
    listen [::]:80;
    server_name community.raspinfo.com;

    # certbot 인증 경로만 열고 나머지는 HTTPS로
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name community.raspinfo.com;

    ssl_certificate     /etc/letsencrypt/live/community.raspinfo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community.raspinfo.com/privkey.pem;

    # 글 본문 상한(40000자) + 여유
    client_max_body_size 1m;

    # 정적 파일은 nginx가 직접 캐시해서 내보낸다
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
